<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgriSense AI · Smart Farming. Smarter Decisions.</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ AgriSense AI : design system ============ */
:root {
  --bg: #EDF1E8; --surface: #FFFFFF; --surface-2: #F5F8F1; --sunken: #E4EADE;
  --line: #DAE2D3; --line-2: #C6D2BE;
  --ink: #16221A; --ink-2: #47594D; --ink-3: #6E8175;
  --forest: #0D2718; --forest-2: #143823; --forest-3: #1D4F32;
  --leaf: #22793E; --leaf-2: #2E9550; --leaf-soft: #DCEFE0; --on-leaf: #FFFFFF;
  --lime: #B8E14A; --lime-soft: #EAF6C4; --lime-ink: #18340C; --lime-soft-ink: #1E3D0E; --on-bad: #FFFFFF;
  --water: #0F8794; --water-2: #22B3C2; --water-soft: #D5EFF2;
  --soil: #8A5A38; --soil-soft: #F0E2D5;
  --warn: #A96A00; --warn-soft: #FBEFCD;
  --bad: #C0392B; --bad-soft: #F9DFDA;
  --shadow: 0 1px 2px rgba(16,34,22,.05), 0 8px 24px -12px rgba(16,34,22,.16);
  --shadow-lg: 0 28px 70px -24px rgba(9,30,18,.4), 0 2px 6px rgba(9,30,18,.08);
  --font: "Figtree", "Noto Sans Tamil", "Noto Sans Devanagari", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Bricolage Grotesque", "Figtree", "Noto Sans Tamil", "Noto Sans Devanagari", ui-sans-serif, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --side: 256px;
  --vh: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  --dg-sky: #E5F0DF; --dg-ground: #CDE2C1; --dg-soil: #6B4A2F; --dg-crop1: #4FA765; --dg-crop2: #3B9155;
  --dg-pipe: #12707B; --dg-device: #FFFFFF; --dg-ink: #2A3B31; --dg-well: #8A9A8F; --dg-well2: #AAB8AF;
  --dg-probe: #EEF2EE; --dg-pole: #7B8B81; --dg-cloud: #F6F9F4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A130D; --surface: #111D15; --surface-2: #16251A; --sunken: #0D1911;
    --line: #22362B; --line-2: #2F4739; --ink: #E6EFE7; --ink-2: #A7B9AC; --ink-3: #768B7D;
    --forest: #06100A; --forest-2: #0C1A11; --forest-3: #153020;
    --leaf: #3FAF63; --leaf-2: #58C77B; --leaf-soft: #153823; --on-leaf: #05140A;
    --lime: #C4EC55; --lime-soft: #26370F; --lime-ink: #10200A; --lime-soft-ink: #D9F58C; --on-bad: #2A0A06;
    --water: #3CC0CF; --water-2: #5DD3E0; --water-soft: #0E3038;
    --soil: #C98F63; --soil-soft: #33241A; --warn: #F0B33A; --warn-soft: #3A2B0B; --bad: #F0705F; --bad-soft: #3E1813;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px -10px rgba(0,0,0,.7); --shadow-lg: 0 28px 70px -24px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.4);
    --dg-sky: #12241A; --dg-ground: #1A3222; --dg-soil: #4A3421; --dg-crop1: #3A9A5B; --dg-crop2: #2C7F49;
    --dg-pipe: #1C93A2; --dg-device: #1C2E22; --dg-ink: #CFE0D3; --dg-well: #5C6E63; --dg-well2: #788A7F;
    --dg-probe: #B5C4BA; --dg-pole: #8A9B90; --dg-cloud: #1F3327; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #0A130D; --surface: #111D15; --surface-2: #16251A; --sunken: #0D1911;
    --line: #22362B; --line-2: #2F4739; --ink: #E6EFE7; --ink-2: #A7B9AC; --ink-3: #768B7D;
    --forest: #06100A; --forest-2: #0C1A11; --forest-3: #153020;
    --leaf: #3FAF63; --leaf-2: #58C77B; --leaf-soft: #153823; --on-leaf: #05140A;
    --lime: #C4EC55; --lime-soft: #26370F; --lime-ink: #10200A; --lime-soft-ink: #D9F58C; --on-bad: #2A0A06;
    --water: #3CC0CF; --water-2: #5DD3E0; --water-soft: #0E3038;
    --soil: #C98F63; --soil-soft: #33241A; --warn: #F0B33A; --warn-soft: #3A2B0B; --bad: #F0705F; --bad-soft: #3E1813;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px -10px rgba(0,0,0,.7); --shadow-lg: 0 28px 70px -24px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.4);
    --dg-sky: #12241A; --dg-ground: #1A3222; --dg-soil: #4A3421; --dg-crop1: #3A9A5B; --dg-crop2: #2C7F49;
    --dg-pipe: #1C93A2; --dg-device: #1C2E22; --dg-ink: #CFE0D3; --dg-well: #5C6E63; --dg-well2: #788A7F;
    --dg-probe: #B5C4BA; --dg-pole: #8A9B90; --dg-cloud: #1F3327; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { height: 100%; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 90px); -webkit-text-size-adjust: 100%; }
body { margin: 0; overflow-x: clip; min-height: 100%; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { font-family: var(--display); letter-spacing: -.015em; line-height: 1.15; }
ul, ol { margin: 0; padding: 0; list-style: none; }
b, strong { font-weight: 650; }
small { font-size: .82em; }
.mono { font-family: var(--mono); font-size: .84em; letter-spacing: 0; }
.mono.sm { font-size: 11.5px; color: var(--ink-3); }
.ic { flex: none; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--leaf-2) 60%, transparent); outline-offset: 2px; border-radius: 8px; }
.row { display: flex; align-items: center; } .gap { gap: 10px; }
.muted { color: var(--ink-3); } .okc { color: var(--leaf); } .badc { color: var(--bad); }
.pad { padding: 16px; } .nowrap { white-space: nowrap; } .r { text-align: right; }
.sub { color: var(--ink-2); margin-top: 6px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 21px/1 var(--display); letter-spacing: -.02em; }
.brand b { color: var(--lime); font-weight: 800; }
.brand.dark b { color: var(--leaf); }

/* ---------- buttons, chips, toggles ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 12px; border: 1.5px solid transparent; background: transparent; font-weight: 650; font-size: 14.5px; line-height: 1; white-space: nowrap; transition: transform .12s, background .15s, box-shadow .15s, border-color .15s; text-decoration: none; }
.btn span:empty { display: none; }
.btn.primary { background: var(--leaf); color: var(--on-leaf); box-shadow: 0 8px 18px -10px var(--leaf); }
.btn.primary:hover:not(:disabled) { background: var(--leaf-2); }
.btn.ghost { border-color: var(--line-2); background: var(--surface); }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); border-color: var(--ink-3); }
.btn.danger { background: var(--bad); color: var(--on-bad); }
.btn.danger-o { border-color: color-mix(in srgb, var(--bad) 45%, transparent); color: var(--bad); background: transparent; }
.btn.danger-o:hover:not(:disabled) { background: var(--bad-soft); }
.btn.sm { height: 36px; padding: 0 13px; font-size: 13.5px; border-radius: 10px; }
.btn.sm.icon { width: 36px; padding: 0; }
.btn.lg { height: 52px; font-size: 16px; border-radius: 14px; }
.btn.xl { height: 64px; font-size: 17px; border-radius: 16px; flex: 1; letter-spacing: .01em; }
.btn.full { width: 100%; }
.btn:disabled { opacity: .42; cursor: not-allowed; box-shadow: none; }
.btn:active:not(:disabled) { transform: translateY(1px); }
label.btn { cursor: pointer; }
.icon-btn { position: relative; width: 42px; height: 42px; display: inline-grid; place-items: center; border-radius: 12px; border: 0; background: transparent; color: var(--ink-2); }
.icon-btn:hover { background: var(--sunken); }
.icon-btn.dark { color: #C5D8C9; } .icon-btn.dark:hover { background: rgba(255,255,255,.1); }
.icon-btn.lg { width: auto; padding: 0 10px; gap: 6px; display: inline-flex; align-items: center; }
.lg-code { font: 700 12px var(--font); }
.link-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--leaf); font-weight: 650; padding: 4px 0; }
.link-btn:hover { text-decoration: underline; } .link-btn.sm { font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 650; line-height: 1; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.chip.ok { background: var(--leaf-soft); color: var(--leaf); } .chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.water { background: var(--water-soft); color: var(--water); }
.chip.lime { background: var(--lime-soft); color: var(--lime-soft-ink); } .chip.gray { background: var(--sunken); color: var(--ink-2); }
.sdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.sdot.ok { background: #2FBF5E; } .sdot.bad { background: var(--bad); } .sdot.warn { background: #E0A100; }
.sdot.on { background: var(--water-2); box-shadow: 0 0 0 0 var(--water-2); animation: ping 1.6s infinite; }
.tgl { width: 52px; height: 30px; border-radius: 999px; border: 0; background: var(--line-2); padding: 3px; transition: background .2s; flex: none; }
.tgl i { display: block; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.tgl.on { background: var(--leaf); } .tgl.on i { transform: translateX(22px); }
.seg { display: inline-flex; padding: 4px; gap: 2px; border-radius: 14px; background: var(--sunken); max-width: 100%; overflow-x: auto; scrollbar-width: none; } .seg::-webkit-scrollbar { display: none; }
.seg button { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); font-weight: 650; font-size: 14px; white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg.sm button { height: 30px; padding: 0 10px; font-size: 12.5px; }
.prog { height: 10px; border-radius: 999px; background: var(--sunken); overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 999px; background: var(--leaf); transition: width .5s; }
.prog.lg { height: 14px; } .prog.watch i { background: #D99A00; } .prog.act i { background: var(--bad); }
.prog i.anim { width: 40%; animation: slide 1.1s ease-in-out infinite alternate; }
.stale-tag, .est-tag { display: inline-flex; align-items: center; gap: 4px; font: 600 11.5px var(--font); color: var(--warn); margin-left: auto; }
.est-tag { margin: 4px 0 0; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
.field label { font-weight: 650; font-size: 13.5px; color: var(--ink-2); }
input:not([type=checkbox]):not([type=range]), select, textarea { width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--line-2); background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s; }
textarea { height: auto; padding: 12px 14px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { border-color: var(--leaf); box-shadow: 0 0 0 4px color-mix(in srgb, var(--leaf) 18%, transparent); }
input:disabled { background: var(--sunken); color: var(--ink-3); }
input[type=range] { width: 100%; accent-color: var(--leaf); height: 30px; }
.input-ic { position: relative; }
.input-ic > .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.input-ic input { padding-left: 44px; }
.eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink-3); border-radius: 10px; }
.check { display: inline-flex; align-items: center; gap: 9px; font-weight: 550; }
.check input { width: 18px; height: 18px; accent-color: var(--leaf); }
.form-err { padding: 11px 14px; border-radius: 12px; background: var(--bad-soft); color: var(--bad); font-weight: 600; font-size: 14px; margin-bottom: 14px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { width: 48px; height: 48px; border-radius: 12px; border: 1.5px solid var(--line-2); background: var(--surface); display: grid; place-items: center; flex: none; }
.stepper button:hover { background: var(--surface-2); }
.stepper input { text-align: center; font-weight: 700; }
.stepper.big { justify-content: space-between; } .stepper.big button { width: 60px; height: 60px; border-radius: 16px; }
.dv { text-align: center; } .dv b { display: block; font: 800 3.4rem/1 var(--display); letter-spacing: -.03em; } .dv span { color: var(--ink-3); font-weight: 600; }
.dchips { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
.dchip { height: 38px; min-width: 54px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line-2); background: var(--surface); font-weight: 650; }
.dchip.on { background: var(--leaf); border-color: var(--leaf); color: var(--on-leaf); }
.daychips { display: flex; gap: 8px; flex-wrap: wrap; }
.daychips button { width: 48px; height: 42px; border-radius: 12px; border: 1.5px solid var(--line-2); background: var(--surface); font-weight: 650; font-size: 13px; }
.daychips button.on { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
.row-end { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.hint { display: flex; align-items: flex-start; gap: 8px; color: var(--ink-2); font-size: 13.5px; margin-top: 10px; }
.hint .ic { margin-top: 2px; color: var(--ink-3); }
.disc { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink-2); margin-top: 14px; }
.disc.big { padding: 14px 16px; border-radius: 14px; background: var(--warn-soft); color: var(--warn); font-weight: 600; margin-top: 20px; }

/* ---------- cards / banners / empty ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 22px; min-width: 0; }
.cardhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
.cardhead h2 { font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
.cardhead p { color: var(--ink-3); font-size: 13.5px; margin-top: 4px; }
.cardhead p.est { display: flex; gap: 6px; color: var(--warn); align-items: center; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.lbl { display: flex; align-items: center; gap: 8px; font-weight: 650; color: var(--ink-2); font-size: 14px; }
.lbl .ic { color: var(--leaf); }
.banners { display: grid; gap: 12px; margin-bottom: 18px; }
.banner { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; border: 1px solid; }
.banner .b-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.banner .b-tx { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; font-size: 14px; }
.banner .b-tx b { font-size: 15px; }
.banner.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 30%, transparent); color: var(--ink); } .banner.bad .b-ic { background: var(--bad); color: var(--on-bad); }
.banner.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); } .banner.warn .b-ic { background: #E7A400; color: #241800; }
.banner.info { background: var(--sunken); border-color: var(--line-2); } .banner.info .b-ic { background: var(--ink-3); color: #fff; }
.banner.water { background: var(--water-soft); border-color: color-mix(in srgb, var(--water) 30%, transparent); } .banner.water .b-ic { background: var(--water); color: #fff; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 48px 24px; background: var(--surface); border: 1.5px dashed var(--line-2); border-radius: 22px; color: var(--ink-2); }
.empty.inline { padding: 28px; grid-column: 1/-1; }
.empty .e-ic { width: 64px; height: 64px; border-radius: 20px; background: var(--leaf-soft); color: var(--leaf); display: grid; place-items: center; }
.empty h3 { font-size: 1.25rem; color: var(--ink); } .empty p { max-width: 46ch; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head h1 { font-size: clamp(1.6rem, 2.6vw, 2.15rem); display: flex; align-items: center; gap: 10px; }
.ph-r { display: flex; gap: 10px; flex-wrap: wrap; }
.sec-t { font-size: 1.2rem; margin: 26px 0 14px; }
.swatch { border-radius: 9px; flex: none; } .swatch.ph { display: inline-block; width: 30px; height: 30px; background: var(--sunken); }

/* ---------- toast / modal / tooltip ---------- */
#toasts { position: fixed; z-index: 400; top: calc(env(safe-area-inset-top, 0px) + 78px); right: 20px; display: flex; flex-direction: column; gap: 10px; width: min(380px, calc(100vw - 32px)); pointer-events: none; }
.toast { display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 12px; border-radius: 16px; background: var(--forest); color: #EAF3EA; box-shadow: var(--shadow-lg); font-weight: 550; font-size: 14px; animation: toastin .3s cubic-bezier(.2, .9, .3, 1.2); pointer-events: auto; border: 1px solid rgba(255,255,255,.08); }
.toast.out { opacity: 0; transform: translateX(20px); transition: .25s; }
.toast .t-ic { width: 32px; height: 32px; border-radius: 10px; background: var(--lime); color: var(--lime-ink); display: grid; place-items: center; flex: none; }
.toast.warn .t-ic { background: #F2B93B; } .toast.rain .t-ic, .toast.motor .t-ic { background: var(--water-2); color: #04262B; } .toast.power .t-ic { background: #F2B93B; color: #2A1B00; }
.scrim { position: fixed; inset: 0; z-index: 300; background: rgba(6, 20, 12, .55); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 20px; animation: fade .2s; overflow-y: auto; }
.modal { width: min(520px, 100%); max-height: calc(100dvh - 40px); overflow-y: auto; background: var(--surface); border-radius: 26px; box-shadow: var(--shadow-lg); animation: rise .28s cubic-bezier(.2, .9, .3, 1.1); border: 1px solid var(--line); }
.modal.wide { width: min(820px, 100%); } .modal.small { width: min(400px, 100%); }
.m-head { display: flex; justify-content: space-between; gap: 16px; padding: 24px 24px 8px; position: sticky; top: 0; background: var(--surface); z-index: 2; }
.m-head h2 { font-size: 1.4rem; } .m-head p { color: var(--ink-2); margin-top: 6px; font-size: 14px; }
.m-body { padding: 14px 24px 8px; } .m-body h4 { margin: 18px 0 10px; font-size: 14px; color: var(--ink-2); }
.m-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px 24px; flex-wrap: wrap; }
.gen { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 40px 30px; text-align: center; color: var(--leaf); } .gen .prog { width: 100%; } .gen b { color: var(--ink); }
body.modal-open { overflow: hidden; } body.modal-open #toasts { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); }
.tip { position: fixed; z-index: 500; pointer-events: none; background: var(--forest); color: #fff; padding: 8px 12px; border-radius: 10px; font-size: 12.5px; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
.tip b { font-size: 14px; }
.more-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px 20px 8px; }
.more-i { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 6px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; font-size: 13px; text-align: center; }

.pick .lang-pills button.on, .login-card .lang-pills button.on, .m-foot .lang-pills button.on { background: var(--leaf); color: var(--on-leaf); }

/* ---------- app shell ---------- */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: var(--vh); }

.menu-wrap { position: relative; }

/* ---------- dashboard ---------- */

.motor-card.run .mc-state { color: var(--lime); } .motor-card.run .chip.water { background: rgba(255, 255, 255, .16); color: #fff; }
.motor-card.run .prog { background: rgba(255, 255, 255, .18); } .motor-card.run .prog i { background: var(--lime); }
.motor-card.run .btn.primary { background: var(--lime); color: var(--lime-ink); box-shadow: none; } .motor-card.run .btn.danger-o { color: #fff; border-color: rgba(255, 255, 255, .5); } .motor-card.run .btn.danger-o:hover { background: rgba(255, 255, 255, .12); }
.motor-card.paused { background: linear-gradient(155deg, #3A2C08, #6B4D0B); color: #fff; border-color: transparent; }

.udot { width: 10px; height: 10px; border-radius: 50%; background: var(--leaf-2); flex: none; }
.set-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; } .col { display: flex; flex-direction: column; gap: 18px; }

/* ---------- admin ---------- */

.tools { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; } .tools.compact { padding: 14px 14px 8px; margin: 0; } .tools .input-ic { width: min(360px, 100%); }

.mon-cam { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 16/6; margin-bottom: 14px; } .mon-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; } .mon-tiles div { padding: 12px 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); display: flex; flex-direction: column; } .mon-tiles small { color: var(--ink-3); font-weight: 600; } .mon-tiles b { font: 750 1.3rem var(--display); }

/* ---------- animations ---------- */
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
@keyframes toastin { from { opacity: 0; transform: translateX(30px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes dash { to { stroke-dashoffset: -28; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes ping { 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
@keyframes ripple { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
@keyframes pulse { 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--lime) 8%, transparent); } }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
@keyframes wave { 0%, 100% { height: 12px; } 50% { height: 64px; } }
@keyframes bounce { 40% { transform: translateY(-5px); } }
@keyframes flash { from { opacity: .95; } to { opacity: 0; } }
@keyframes scan { from { top: 4%; } to { top: 94%; } }
@keyframes slide { from { margin-left: 0; } to { margin-left: 60%; } }

/* ---------- diagram ---------- */
.sysdiag .dev { fill: var(--dg-device); stroke: var(--line-2); stroke-width: 1.5; }
.sysdiag .dgt { font: 700 12px var(--font); fill: var(--dg-ink); text-anchor: middle; } .sysdiag .dgt.s { font-size: 10.5px; font-weight: 600; text-anchor: start; fill: var(--ink-3); } .sysdiag .dgt.b { font-size: 14px; }
.sysdiag .dgchip rect { fill: var(--surface); stroke: var(--line-2); } .sysdiag .dgchip text { font: 650 11.5px var(--font); fill: var(--ink); }
.sysdiag .dgchip.val text { fill: var(--leaf); } .sysdiag .dgchip.mute text { fill: var(--ink-3); font-weight: 600; } .sysdiag .dgchip.bad rect { fill: var(--bad-soft); stroke: var(--bad); } .sysdiag .dgchip.bad text { fill: var(--bad); } .sysdiag .dgchip.wet rect { fill: var(--water-soft); stroke: var(--water); } .sysdiag .dgchip.wet text { fill: var(--water); }
.sysdiag .pipe, .sysdiag .pipe-s { fill: none; stroke: var(--dg-pipe); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; opacity: .92; } .sysdiag .pipe-s { stroke-width: 6; }
.sysdiag .pipe-flow { fill: none; stroke: #C8F4F8; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 2 12; opacity: 0; } .sysdiag.on .pipe-flow { opacity: 1; animation: dash .8s linear infinite; }
.sysdiag .lat { stroke: var(--water-2); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 3 9; opacity: 0; } .sysdiag.on .lat { opacity: .95; animation: dash 1s linear infinite; }
.sysdiag .wire { fill: none; stroke: var(--ink-3); stroke-width: 1.6; stroke-dasharray: 2 5; opacity: .75; }
.sysdiag .wire-cloud { fill: none; stroke: var(--leaf-2); stroke-width: 2; stroke-dasharray: 4 7; animation: dash 1.6s linear infinite; } .sysdiag .wire-cloud.cut { stroke: var(--bad); animation: none; opacity: .7; }
.sysdiag .led { fill: #98AAA0; } .sysdiag .led.ok { fill: #34C863; } .sysdiag .led.bad { fill: var(--bad); }
.sysdiag .fan { transform-origin: 0 0; } .sysdiag.on .fan { animation: spin 1s linear infinite; }
.sysdiag.off > *:not(defs) { filter: grayscale(.7); opacity: .92; }
.sysdiag .drops line { animation: dash .7s linear infinite; stroke-dasharray: 4 6; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .dash-hero { grid-template-columns: 1fr; }
  .astat-grid { grid-template-columns: repeat(3, 1fr); }
  .crop-grid { grid-template-columns: 1fr 1fr; }
  .fa-grid, .req-grid, .sup-grid { grid-template-columns: 1fr; } .form-card { position: static; }
}
@media (max-width: 980px) {

  .login { grid-template-columns: 1fr; } .login-art { display: none; }
  .ir-grid, .ai-grid, .ai-grid.health, .ai-grid.scan, .cam-grid, .amid, .set-grid, .dash-mid, .dash-low { grid-template-columns: 1fr; }
  .chat { height: 640px; }
}
@media (max-width: 900px) {

  .fs-wrap { flex: 1; min-width: 0; } .fsel { width: 100%; padding-right: 10px; } .fs-tx { flex: 1; } .fs-tx b { max-width: none; } .tb-r { flex: none; gap: 0; } .icon-btn { width: 38px; } .btn-av { margin-left: 4px; }
  .bnav { display: flex; position: fixed; z-index: 80; left: 0; right: 0; bottom: 0; padding: 6px 8px calc(env(safe-area-inset-bottom, 0px) + 6px); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
  .bnav button { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; border: 0; background: none; color: var(--ink-3); font-size: 11px; font-weight: 650; border-radius: 12px; }
  .bnav button.on { color: var(--leaf); } .bnav button.on .ic { background: var(--lime); color: var(--lime-ink); padding: 5px 16px; box-sizing: content-box; border-radius: 999px; margin: -5px 0; }
  .bnav .nb.dot { position: absolute; top: 5px; right: calc(50% - 20px); min-width: 0; width: 10px; height: 10px; padding: 0; border: 2px solid var(--surface); box-sizing: content-box; }
  .page { padding-bottom: 130px; }

function rng(seed) { let s = (seed >>> 0) || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function fitTotal(arr, total) {
  const sum = arr.reduce((a, b) => a + b, 0) || 1;
  const out = arr.map(v => Math.round(v * total / sum));
  const diff = total - out.reduce((a, b) => a + b, 0);
  let mi = 0; out.forEach((v, i) => { if (v > out[mi]) mi = i; });
  out[mi] += diff; return out;
}

function fmtClock(m) {
  m = ((Math.floor(m) % 1440) + 1440) % 1440;
  let h = Math.floor(m / 60); const mm = m % 60; const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  return String(h).padStart(2, "0") + ":" + String(mm).padStart(2, "0") + " " + ap;
}
function hhmmToMin(s) { const [h, m] = s.split(":").map(Number); return h * 60 + m; }
function minToHHMM(m) { return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
function fmtMin(m) { m = Math.max(0, Math.round(m)); if (m >= 60) { const h = Math.floor(m / 60), r = m % 60; return h + " h" + (r ? " " + String(r).padStart(2, "0") + " min" : ""); } return m + " min"; }

/* returns true when something structural changed (needs a full re-render) */
function simStep(dt) {
  const prev = S.clock; S.clock = Math.min(1439, S.clock + dt);
  const dtReal = S.clock - prev; if (dtReal <= 0) return false;
  let changed = false;
  const dayIdx = (new Date().getDay() + 6) % 7;
  for (const f of Object.values(S.fields)) {
    if (f.noData || !f.online) continue;
    if (f.rain !== "none") f.rainMin += dtReal;
    const m = f.motor;
    if (m.on && !m.paused && !f.power.failed) {
      m.elapsed = Math.min(m.duration, m.elapsed + dtReal);
      if (f.curRun) f.curRun.segs[f.curRun.segs.length - 1][1] = S.clock;
      f.waterToday += dtReal * f.flowRate;

/* ---------- bar chart with hover tips ---------- */

  const ticks = Math.max(2, Math.ceil(max / step)), top = ticks * step; const pw = W - L - Rr, ph = H - T - B, bw = pw / n;
  let g = "";

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

function chip(text, kind = "", icon = "") { return `<span class="chip ${kind}">${icon ? ic(icon, 14) : ""}${text}</span>`; }
function dot(kind) { return `<i class="sdot ${kind}"></i>`; }
function tgl(on, act, arg, label) { return `<button class="tgl ${on ? "on" : ""}" role="switch" aria-checked="${on}" aria-label="${esc(label || "")}" data-act="${act}" data-arg="${esc(arg || "")}"><i></i></button>`; }
function btn(label, act, arg, o = {}) {
  return `<button class="btn ${o.kind || ""} ${o.size || ""}" data-act="${act}" ${arg !== undefined ? `data-arg="${esc(arg)}"` : ""} ${o.arg2 !== undefined ? `data-arg2="${esc(o.arg2)}"` : ""} ${o.disabled ? "disabled" : ""} ${o.id ? `id="${o.id}"` : ""}>${o.icon ? ic(o.icon, o.iconSize || 18) : ""}<span>${label}</span></button>`;
}
function pageHead(title, sub, right = "") {
  return `<div class="page-head"><div><h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ""}</div>${right ? `<div class="ph-r">${right}</div>` : ""}</div>`;
}
function banner(kind, icon, title, body, actions = "") {
  return `<div class="banner ${kind}" role="status"><span class="b-ic">${ic(icon, 22)}</span><div class="b-tx"><b>${title}</b><span>${body}</span></div>${actions ? `<div class="b-ac">${actions}</div>` : ""}</div>`;
}
function emptyState(icon, title, body, action = "") {
  return `<div class="empty"><span class="e-ic">${ic(icon, 30)}</span><h3>${title}</h3><p>${body}</p>${action}</div>`;
}
function tabs(items, active, act, extra = "") {
  return `<div class="seg" role="tablist" ${extra}>${items.map(([id, label, icon]) => `<button role="tab" aria-selected="${id === active}" class="${id === active ? "on" : ""}" data-act="${act}" data-arg="${id}">${icon ? ic(icon, 16) : ""}<span>${label}</span></button>`).join("")}</div>`;
}
function fieldStatusChip(f) {
  if (f.noData) return chip(t("mf.noData"), "gray");

}
function motorChip(f) {

}
function notifIcon(type) { return { motor: "motor", power: "zap", rain: "rain", sensor: "activity", ai: "spark", request: "message" }[type] || "bell"; }
function greetKey() { const h = new Date().getHours(); return h < 12 ? "greet.m" : h < 17 ? "greet.a" : "greet.e"; }
function initial(name) { return (name || "?").trim().charAt(0).toUpperCase(); }

/* ---------- toasts / modal / tooltip ---------- */
function toast(msg, kind = "info") {
  const root = $("#toasts"); if (!root) return;
  const el = document.createElement("div"); el.className = "toast " + kind; el.setAttribute("role", "status");
  const icn = { motor: "motor", power: "zap", rain: "rain", sensor: "activity", ai: "spark", ok: "check", warn: "alert", info: "info" }[kind] || "info";
  el.innerHTML = `<span class="t-ic">${ic(icn, 18)}</span><span>${esc(msg)}</span>`;
  root.appendChild(el);
  while (root.children.length > 3) root.removeChild(root.firstChild);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 250); }, 4200);
}
function openModal(html, cls = "") {
  $("#modal-root").innerHTML = `<div class="scrim" data-act="scrim"><div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.classList.add("modal-open");
  const first = $("#modal-root input, #modal-root select, #modal-root textarea"); if (first) setTimeout(() => first.focus(), 30);
}
function closeModal() { $("#modal-root").innerHTML = ""; document.body.classList.remove("modal-open"); }
function modalHead(title, sub) { return `<div class="m-head"><div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ""}</div><button class="icon-btn" data-act="closeModal" aria-label="${t("c.close")}">${ic("x", 20)}</button></div>`; }

/* ---------- master render ---------- */
const PAGES = { farmer: {}, admin: {} };
function render(opts = {}) {
  const y = window.scrollY;
  document.documentElement.lang = LANG;
  document.body.dataset.screen = S.screen;
  const a = $("#app");
  a.innerHTML = S.screen === "landing" ? landingHTML() : S.screen === "login" ? loginHTML() : S.screen === "pick" ? pickHTML() : shellHTML();

  afterRender();
}
function afterRender() { if (typeof onAfterRender === "function") onAfterRender(); }

/* ============ FARMER PAGES (1/2) ============ */
function scoreRing(score, size = 120, sw = 12) {
  const r = (size - sw) / 2, c = size / 2, col = score >= 80 ? "var(--leaf)" : score >= 60 ? "var(--warn)" : "var(--bad)";
  return `<div class="ring" style="--s:${size}px"><svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--sunken)" stroke-width="${sw}"/><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" pathLength="100" stroke-dasharray="${score} 100" transform="rotate(-90 ${c} ${c})"/></svg><div class="ring-c"><b>${score}</b><span>${t("fh.outOf")}</span></div></div>`;
}
function guard(fn) {
  return () => {
    if (!myFields().length) return `${pageHead(t("nav." + S.page))}${emptyState("sprout", t("er.noFieldsT"), t("er.noFieldsB"), btn(t("c.contact"), "go", "support", { kind: "primary", icon: "message" }))}`;
    return fn(curField());
  };
}
function lastOpText(f) { const o = f.motor.lastOp; return o ? t("sc.today") + ", " + fmtClock(o.start) : "—"; }
function stale(f) { return !f.online && !f.noData ? `<span class="stale-tag">${ic("clock", 12)}${t("lastUpd")} ${offlineMin(f)} min</span>` : ""; }
function V(f, v, unit = "") { return f.noData ? "—" : v + unit; }
function pct(f) { return f.motor.duration ? clamp(f.motor.elapsed / f.motor.duration * 100, 0, 100) : 0; }
function runStatusChip(r) {
  if (r.status === "running") return chip(dot("on") + t("sc.running"), "water");
  if (r.status === "stopped") return chip(r.note === "rain" ? t("mc.stoppedRain") : t("sc.stopped"), "warn");
  return chip(t("sc.completed"), "ok");
}
function historyRows(f) {
  const rows = [];
  f.runs.slice().sort((a, b) => b.segs[0][0] - a.segs[0][0]).forEach(r => {
    const s = r.segs[0][0], e = r.segs[r.segs.length - 1][1];
    rows.push({ day: t("sc.today"), start: fmtClock(s), end: r.status === "running" ? "…" : fmtClock(e), type: r.type, chip: runStatusChip(r), gap: r.gap });
  });
  const dm = { y: "sc.yesterday", d2: "sc.ago2", d3: "sc.ago3" };
  f.past.forEach(p => rows.push({ day: t(dm[p.day]), start: p.start, end: p.end, type: p.type, chip: chip(t("sc.completed"), "ok") }));
  return rows;
}
function historyList(f, max = 99) {
  return `<ul class="hlist">${historyRows(f).slice(0, max).map(r => `<li><div class="h-l"><span class="h-day">${r.day}<em class="h-type ${r.type}">${t(r.type === "auto" ? "mc.auto" : "mc.manual")}</em></span><span class="h-time">${r.start}${ic("arrow", 13)}${r.end}</span></div><div class="h-r">${r.chip}${r.gap ? `<span class="h-note">${ic("zap", 12)}${r.gap} min</span>` : ""}</div></li>`).join("")}</ul>`;
}

/* ---------- motor card (dashboard) ---------- */
function motorCard(f) {
  const m = f.motor, run = m.on && !m.paused, blocked = !f.online || f.noData;
  const state = f.noData ? "nodata" : m.paused ? "paused" : m.on ? "run" : "off";
  return `<article class="card motor-card ${state}">
   <div class="mcard-top"><span class="lbl">${ic("motor", 18)}${t("motor")}</span>${stale(f)}${motorChip(f)}</div>
   <div class="mc-big"><b class="mc-state">${f.noData ? "—" : m.paused ? t("mc.paused") : m.on ? t("on") : t("off")}</b><span class="mc-pump">${f.pump} · ${f.hp} HP</span></div>
   ${m.on ? `<div class="prog lg"><i data-live-w="m.bar" style="width:${pct(f).toFixed(1)}%"></i></div>
     <div class="mc-times"><span>${t("mc.elapsed")}<b data-live="m.elapsed">${fmtMin(m.elapsed)}</b></span><span>${t("mc.remaining")}<b data-live="m.remaining">${fmtMin(m.duration - m.elapsed)}</b></span></div>` : `<div class="mc-info"><div class="mc-last"><span>${t("lastOp")}</span><b>${lastOpText(f)}</b></div>${nextRun(f) ? `<div class="mc-last"><span>${t("nextRun")}</span><b>${t(nextRun(f).when)}, ${fmtClock(nextRun(f).t)}</b></div>` : ""}</div>`}
   <div class="mc-act">${btn(t("ctl"), "go", "irrigation", { kind: "primary", icon: "motor" })}${m.on && !blocked ? btn(t("mc.stop"), "askStop", "", { kind: "danger-o", icon: "stop", size: "" }) : ""}</div>
  </article>`;
}
function liveCard(f) {
  return `<article class="card live-card"><div class="cardhead"><div><h2>${t("liveView")}</h2><p>${t("liveViewSub")}</p></div><div class="chips">${fieldStatusChip(f)}${f.power.failed ? chip(t("pw.failed"), "warn", "zap") : ""}</div></div><div class="diag-wrap">${systemDiagram(f)}</div></article>`;
}

/* ---------- stat cards ---------- */
function statSoil(f) {
  const lv = soilLevel(f.soil), col = lv === "dry" ? "warn" : lv === "wet" ? "water" : "ok";
  return `<article class="card stat ${!f.online ? "is-stale" : ""}"><div class="lbl">${ic("drop", 18)}${t("soil")}${stale(f)}</div>
   <div class="gauge-wrap">${soilGauge(f.noData ? 0 : f.soil, true)}<div class="g-c"><b data-live="soil">${V(f, Math.round(f.soil), "%")}</b>${f.noData ? "" : chip(t("soil." + lv), col)}</div></div></article>`;
}
function statTemp(f) {
  const lv = tempLevel(f.temp);
  return `<article class="card stat ${!f.online ? "is-stale" : ""}"><div class="lbl">${ic("thermo", 18)}${t("temp")}${stale(f)}</div><div class="big-n"><b>${V(f, Math.round(f.temp), "°C")}</b></div>${f.noData ? "" : chip(t("temp." + lv), lv === "hot" ? "warn" : "ok")}<div class="sp">${f.noData ? "" : `<small>${t("se.trend")}</small>` + spark(trendSeries(f, "temp"), "var(--soil)")}</div></article>`;
}
function statHum(f) {
  return `<article class="card stat ${!f.online ? "is-stale" : ""}"><div class="lbl">${ic("droplets", 18)}${t("hum")}${stale(f)}</div><div class="big-n"><b>${V(f, Math.round(f.hum), "%")}</b></div>${f.noData ? "" : chip(t("hum.ok"), "ok")}<div class="sp">${f.noData ? "" : `<small>${t("se.trend")}</small>` + spark(trendSeries(f, "hum"), "var(--water)")}</div></article>`;
}
function statRain(f) {
  const r = f.rain !== "none";
  return `<article class="card stat rain-card ${r ? "wet" : ""} ${!f.online ? "is-stale" : ""}"><div class="lbl">${ic("rain", 18)}${t("rain")}${stale(f)}</div><div class="rain-ic">${ic(r ? "rain" : "sun", 44)}</div><div class="big-n sm"><b>${f.noData ? "—" : t("rain." + f.rain)}</b></div>${chip(t("rp.title") + ": " + (f.rainProt.enabled ? t("on") : t("off")), f.rainProt.enabled ? "ok" : "gray", "shield")}</article>`;
}
function statWater(f) {
  const y = f.weekPrev[5] || 1, d = Math.round((f.waterToday - y) / y * 100), wk = weekArr(f);
  return `<article class="card stat ${!f.online ? "is-stale" : ""}"><div class="lbl">${ic("waves", 18)}${t("water")}${stale(f)}</div><div class="big-n"><b data-live="w.today">${f.noData ? "—" : num(f.waterToday)}</b><small>${t("wu.liters")}</small></div>${f.noData ? "" : chip(ic(d >= 0 ? "up" : "dn", 14) + t("vsY", { p: Math.abs(d), d: t(d >= 0 ? "more" : "less") }), d > 12 ? "warn" : "ok")}${f.estimated ? `<span class="est-tag">${t("se.estimated")}</span>` : ""}<div class="mini-bars">${wk.map((v, i) => `<i class="${i === 6 ? "now" : ""}" style="height:${Math.max(8, v / Math.max(...wk) * 100)}%"></i>`).join("")}</div></article>`;
}
function wifiBars(rssi) { const n = rssi > -55 ? 4 : rssi > -65 ? 3 : rssi > -75 ? 2 : 1; return `<span class="wbars" title="${rssi} dBm">${[1, 2, 3, 4].map(i => `<i class="${i <= n ? "on" : ""}" style="height:${i * 25}%"></i>`).join("")}</span>`; }
function statEsp(f) {
  return `<article class="card stat esp ${f.online ? "" : "bad"}"><div class="lbl">${ic("cpu", 18)}${t("esp")}</div><div class="big-n sm"><b>${f.noData ? t("offline").toUpperCase() : f.online ? t("online").toUpperCase() : t("offline").toUpperCase()}</b></div>${f.online ? chip(dot("ok") + t("syncAgo", { m: f.syncAge }), "ok") : chip(dot("bad") + offlineMin(f) + " min", "bad")}<div class="esp-row"><span>${wifiBars(f.rssi)}${f.rssi} dBm</span><span>${ic("battery", 16)}${f.battery}%</span></div></article>`;
}

function weekdayLabels(n) {
  const out = []; for (let i = n - 1; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); out.push(i === 0 ? t("wu.today") : d.toLocaleDateString(langTag(), { weekday: "short" })); } return out;
}
function dateLabels(n) {
  const out = []; for (let i = n - 1; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); out.push(d.toLocaleDateString(langTag(), { day: "numeric", month: "short" })); } return out;
}

/* ---------- irrigation ---------- */
function blockReason(f) {
  if (!S.netOnline) return t("mc.blockNet");
  if (!f.online) return t("mc.blockOff");
  if (f.power.failed && !f.motor.on) return t("mc.blockPower");
  return "";

function detectIntent(q) { const s = q.toLowerCase(); for (const [k, ws] of AI_KEYS) if (ws.some(w => s.includes(w))) return k; return "default"; }
function aiAnswer(intent, f) {
  const soil = Math.round(f.soil), nm = esc(f.name), rainOn = f.rain !== "none";
  const advKey = !f.online ? "ai.adv.off" : soilLevel(f.soil) === "dry" ? "ai.adv.low" : soilLevel(f.soil) === "wet" ? "ai.adv.wet" : "ai.adv.ok";
  switch (intent) {
    case "status": return { text: t("ai.r.status", { f: nm, soil, temp: Math.round(f.temp), hum: Math.round(f.hum), motor: f.motor.on ? t("on") : t("off"), rain: t(rainOn ? "ai.rain.on" : "ai.rain.none"), advice: t(advKey) }) };
    case "irr": {
      let k = "ai.r.irrOk";
      if (!f.online) k = "ai.r.irrOff"; else if (f.motor.on) k = "ai.r.irrOn"; else if (rainOn) k = "ai.r.irrRain"; else if (soilLevel(f.soil) === "dry") k = "ai.r.irrLow"; else if (soilLevel(f.soil) === "wet") k = "ai.r.irrWet";
      return { text: t(k, { f: nm, soil, min: f.schedule.duration, rem: Math.ceil(f.motor.duration - f.motor.elapsed) }), actions: [{ label: "ai.act.irr", page: "irrigation" }] };
    }
    case "soil": return { text: t("ai.r.soil", { f: nm, soil, crop: cropName(f.crop), advice: t(advKey) }) };
    case "crop": return { text: t("ai.r.crop", { f: nm }), crops: f.id, note: t("ai.r.cropNote"), actions: [{ label: "ai.act.crops", page: "crops" }] };
    case "image": return { text: t("ai.r.image"), actions: [{ label: "ai.act.scan", page: "ai", tab: "scan" }] };
    case "water": { const w = sum(weekArr(f)), y = f.weekPrev[5] || 1, d = Math.round((f.waterToday - y) / y * 100); return { text: t("ai.r.water", { f: nm, week: num(w), today: num(f.waterToday), pct: Math.abs(d), dir: t(d >= 0 ? "more" : "less") }), actions: [{ label: "ai.act.water", page: "water" }] }; }

  }
}

function hashN(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
function adminRows() {
  const live = USERS.Vijay.fieldIds.map(id => S.fields[id]).filter(Boolean).map(f => ({
    id: f.id, name: f.name, farmer: "Vijay", loc: f.location, esp: f.esp, motor: f.motor.on ? "ON" : "OFF", soil: f.noData ? null : Math.round(f.soil), temp: f.noData ? null : Math.round(f.temp),
    status: f.noData ? "No data" : f.online ? "Online" : "Offline", live: f, pump: f.pump,
  }));
  const oth = S.aFields.map(r => Object.assign({ status: r.status, pump: r.pump || "Water Pump 01" }, r, { loc: r.loc, live: null }));
  return live.concat(oth);
}
function aStatusChip(s) { return s === "Online" ? chip(dot("ok") + s, "ok") : s === "Offline" ? chip(dot("bad") + s, "bad") : chip(s, "gray"); }
function devInfo(r) {
  const h = hashN(r.id), f = r.live;
  return { fw: f ? f.fw : ["v2.4.1", "v2.4.0", "v2.3.7"][h % 3], rssi: f ? f.rssi : -50 - (h % 35), batt: f ? f.battery : 20 + (h % 78), sens: f ? (f.noData ? 0 : Object.values(f.sensors).filter(Boolean).length) : (r.status === "Offline" ? 3 : 4), sync: r.status === "Offline" ? (f ? offlineMin(f) + " min ago" : (12 + h % 90) + " min ago") : r.status === "No data" ? "—" : (1 + h % 4) + " min ago" };
}
function pendingCount() { return S.requests.filter(r => r.status === "pending").length; }
function statCard(icon, label, val, note, tone = "") { return `<article class="card astat ${tone}"><span class="as-ic">${ic(icon, 22)}</span><div><small>${label}</small><b>${val}</b>${note ? `<em>${note}</em>` : ""}</div></article>`; }

const ACT = {}, INP = {}, CHG = {};

/* ---- render hooks: keep typed input values across re-renders ---- */
function snapshotInputs() {
  const snap = { vals: {}, focus: null };
  $$("#page input[id], #page textarea[id], #page select[id]").forEach(el => { snap.vals[el.id] = el.type === "checkbox" ? el.checked : el.value; });
  const a = document.activeElement;
  if (a && a.id && $("#page") && $("#page").contains(a)) snap.focus = { id: a.id, s: a.selectionStart, e: a.selectionEnd };
  return snap;
}
function restoreInputs(snap) {
  if (!snap) return;
  for (const id in snap.vals) { const el = document.getElementById(id); if (el && !el.disabled) { if (el.type === "checkbox") el.checked = snap.vals[id]; else if (el.value !== snap.vals[id]) el.value = snap.vals[id]; } }
  if (snap.focus) { const el = document.getElementById(snap.focus.id); if (el) { el.focus(); try { if (snap.focus.s != null) el.setSelectionRange(snap.focus.s, snap.focus.e); } catch (e) { } } }
}
function onAfterRender() {
  const cl = $("#chatlist"); if (cl) cl.scrollTop = cl.scrollHeight;
  liveUpdate();
}
const _render = render;
render = function (opts = {}) {
  const snap = opts.top ? null : snapshotInputs();
  _render(opts);
  restoreInputs(snap);
};

/* ---- live values (no re-render) ---- */
const LIVE = {
  "clock": () => fmtClock(S.clock),
  "notif.count": () => S.role === "admin" ? S.aNotifs.filter(x => !x.read).length : unreadCount(),
  "soil": f => Math.round(f.soil) + "%",
  "w.today": f => num(f.waterToday),
  "m.elapsed": f => fmtMin(f.motor.elapsed),
  "m.remaining": f => fmtMin(f.motor.duration - f.motor.elapsed),
  "m.elapsedN": f => Math.floor(f.motor.elapsed),
  "flow": f => f.motor.on && !f.motor.paused ? f.flowRate : 0,
  "f.motor": f => f.noData ? "—" : f.motor.paused ? t("mc.paused") : f.motor.on ? t("on") : t("off"),
  "f.soil": f => f.noData ? "—" : Math.round(f.soil) + "%",
};
const LIVE_N = { "m.bar": f => pct(f), "soil": f => f.soil };
function liveUpdate() {
  const cf = S.role === "farmer" ? curField() : null;
  $$("[data-live]").forEach(el => {
    const [k, arg] = el.dataset.live.split(":"); const fn = LIVE[k]; if (!fn) return;
    const f = arg ? S.fields[arg] : cf; if (!f && k !== "clock" && k !== "notif.count") return;
    const v = fn(f); if (el.textContent !== String(v)) el.textContent = v;
    if (k === "notif.count") el.hidden = !v;
  });
  if (!cf) return;
  $$("[data-live-w]").forEach(el => { const fn = LIVE_N[el.dataset.liveW]; if (fn) el.style.width = fn(cf).toFixed(1) + "%"; });
  $$("[data-live-dash]").forEach(el => { const fn = LIVE_N[el.dataset.liveDash]; if (fn) el.setAttribute("stroke-dasharray", Math.max(.5, fn(cf)).toFixed(1) + " 100"); });
}

/* ---- simulation loop ---- */

  if (S.screen === "landing" || S.screen === "login") return;

}, 1000);

/* ---- events ---- */
document.addEventListener("click", e => {
  if (!e.target.closest(".menu-wrap")) $$(".menu").forEach(m => { m.hidden = true; });
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  if (act === "scrim") { if (e.target === el) closeModal(); return; }
  if (el.disabled) return;
  const fn = ACT[act]; if (fn) fn(el.dataset.arg, el.dataset.arg2, el, e);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeModal(); $$(".menu").forEach(m => { m.hidden = true; }); return; }
  const el = e.target.closest && e.target.closest("[data-enter]");
  if (el && (e.key === "Enter" || (e.key === " " && el.getAttribute("role") === "button"))) {
    if (el.tagName === "TEXTAREA") return; e.preventDefault(); const fn = ACT[el.dataset.enter]; if (fn) fn(el.dataset.arg, el.dataset.arg2, el, e);
  }
});
document.addEventListener("input", e => { const k = e.target.dataset && e.target.dataset.input; if (k && INP[k]) INP[k](e.target); });
document.addEventListener("change", e => { const k = e.target.dataset && e.target.dataset.change; if (k && CHG[k]) CHG[k](e.target); });

document.addEventListener("mouseover", e => { const g = e.target.closest("[data-tip]"); if (!g) return; const [a, b] = g.dataset.tip.split("|"); const el = tip(); el.innerHTML = `<b>${esc(b)}</b><span>${esc(a)}</span>`; el.hidden = false; });

};
ACT.scanSample = () => { const k = LEAF_KINDS[S.scan.n % 3]; runScan({ svg: leafScene(k) }, k); };
ACT.scanField = () => { const f = curField(), im = f.images[0] || {}; runScan({ svg: fieldScene(f, Object.assign({ lite: true }, im)) }, (im.stress || 0) > .2 ? "def" : "healthy"); };
ACT.scanReset = () => { S.scan = { img: null, result: false, busy: false, n: S.scan.n }; render(); };

/* ---- crops / prefs / profile ---- */
ACT.cropDetail = i => { const f = curField(); if (!REC[f.id]) REC[f.id] = REC["FIELD-001"]; cropDetailModal(f, +i); };
ACT.pref = k => { S.prefs[k] = !S.prefs[k]; render(); };
ACT.saveProfile = () => { S.user.name = $("#pf-name").value.trim() || S.user.name; S.user.phone = $("#pf-phone").value.trim() || S.user.phone; S.user.email = $("#pf-email").value.trim() || S.user.email; render(); toast(t("st.saved"), "ok"); };
ACT.saveAdminProfile = () => { S.admin.name = $("#pf-name").value.trim() || S.admin.name; render(); toast(t("st.saved"), "ok"); };
ACT.chgPass = () => openModal(`${modalHead(t("st.chgPass"))}<div class="m-body"><div class="field"><label for="pw-cur">${t("st.curPass")}</label><input id="pw-cur" type="password"></div><div class="field"><label for="pw-new">${t("st.newPass")}</label><input id="pw-new" type="password"></div><div id="pw-err" class="form-err" hidden></div></div><div class="m-foot">${btn(t("c.cancel"), "closeModal", "", { kind: "ghost" })}${btn(t("c.save"), "doPass", "", { kind: "primary", icon: "check" })}</div>`);
ACT.doPass = () => { const n = $("#pw-new").value; if (n.length < 6) { const e = $("#pw-err"); e.textContent = t("st.passShort"); e.hidden = false; return; } closeModal(); toast(t("st.passDone"), "ok"); };

/* ---- support (farmer) ---- */
ACT.sendReq = () => {
  const msg = $("#su-msg").value.trim(); if (!msg) return toast(t("su.msg"), "warn");
  const type = $("#su-type").value, fid = $("#su-field") ? $("#su-field").value : S.fieldId;
  const id = "REQ-" + (1049 + (S.reqCount = (S.reqCount || 0) + 1)); const at = "Today, " + fmtClock(S.clock);
  S.requests.unshift({ id, farmerId: S.user.id, farmer: S.user.name, fid, type, status: "pending", created: at, tech: null, thread: [{ from: "farmer", text: msg, at }] });
  S.aNotifs.unshift({ id: ++S.nid, type: "request", text: `New request ${id} from ${S.user.name}: ${t("su.t." + type)}.`, at: S.clock, read: false });
  S.reqSel = id; S.reqPre = null; render(); toast(t("su.sent"), "ok");
};
ACT.selReq = id => { S.reqSel = id; render(); };
ACT.farmerReply = () => { const i = $("#su-reply"), v = i && i.value.trim(); const r = S.requests.find(x => x.id === S.reqSel) || S.requests.filter(x => x.farmerId === S.user.id).find(x => x.thread.length > 1); if (!v || !r) return; r.thread.push({ from: "farmer", text: v, at: "Today, " + fmtClock(S.clock) }); render(); };

/* ---- admin ---- */
ACT.aFilter = k => { S.aFilter = k; render(); };
INP.aSearch = el => { S.aQ = el.value; render(); };
INP.aSearch2 = el => { S.aQ2 = el.value; render(); };
INP.aSearch3 = el => { S.aQ3 = el.value; render(); };
ACT.aFieldFilter = k => { S.fieldFilter = k; render(); };
ACT.reqFilter = k => { S.reqFilter = k; render(); };
ACT.aAddFarmer = () => addFarmerModal();
ACT.aSaveFarmer = () => {
  const n = $("#af-name").value.trim(); if (!n) return toast("Enter the farmer name.", "warn");
  const id = "FRM" + String(S.aFarmers.length + 1).padStart(3, "0");
  S.aFarmers.push({ id, name: n, phone: $("#af-phone").value.trim() || "+91", fields: 0, status: "Active", last: "Just now", district: $("#af-dist").value.trim() || "—" });
  closeModal(); render(); toast(`${n} added as ${id}.`, "ok");
};
ACT.aViewFarmer = id => farmerModal(id);
ACT.aEditField = id => { S.aEdit = id; render(); const f = $(".form-card"); if (f && window.innerWidth < 1000) f.scrollIntoView({ behavior: "smooth", block: "start" }); };
ACT.aCancelEdit = () => { S.aEdit = null; render(); };
ACT.aSaveField = () => {
  const farmer = $("#ff-farmer").value, name = $("#ff-name").value.trim(), loc = $("#ff-loc").value.trim(), esp = $("#ff-esp").value.trim(), motor = $("#ff-motor").value;
  if (!name || !loc || !esp) return toast("Fill in the field name, location and ESP32 ID.", "warn");
  const pump = motor.split(" (")[0], hp = parseFloat((motor.match(/\(([\d.]+) HP/) || [0, 5])[1]);
  if (S.aEdit) {
    const f = S.fields[S.aEdit];
    if (f) { f.name = name; f.location = loc; f.esp = esp; f.pump = pump; f.hp = hp; } else { const r = S.aFields.find(x => x.id === S.aEdit); if (r) Object.assign(r, { name, loc, esp, pump }); }
    S.aEdit = null; render(); return toast("Field updated. The Field ID did not change.", "ok");
  }
  const id = $("#ff-id").value;
  if (farmer === "Vijay") {
    const n = USERS.Vijay.fieldIds.length + 1;
    const f = mkField({ id, idn: n, name, location: loc, area: 1.5, soilType: "red", crop: "groundnut", cropDay: 0, esp, cam: "ESP32-CAM-" + String(n).padStart(3, "0"), online: false, noData: true, camOnline: false, soil: 0, temp: 0, hum: 0, waterToday: 0, weekPrev: [0, 0, 0, 0, 0, 0], monthTotal: 0, palette: { a: "#6DB56F", b: "#3E8A4C", soil: "#68492E", angle: 40, leaf: "#4E9A5C" }, health: { soil: 60, temp: 60, hum: 60, irr: 60, water: 60, crop: 60 }, camImgs: [], pump, hp });
    finishField(f); S.fields[id] = f; USERS.Vijay.fieldIds.push(id);
  } else {
    S.aFields.push({ id, name, farmer, loc, esp, motor: "OFF", soil: null, temp: null, status: "No data", pump });
    const fm = S.aFarmers.find(x => x.name === farmer); if (fm) fm.fields++;
  }
  render(); toast(`${name} added and assigned to ${farmer}.`, "ok");
};
ACT.aMonitor = id => monitorModal(id);
ACT.aDevice = id => deviceModal(id);
ACT.aRestart = esp => { closeModal(); toast(`Restart command sent to ${esp}.`, "ok"); };
ACT.aMsgFarmer = name => { closeModal(); toast(`Open a request to message ${name}.`, "info"); ACT.go("requests"); };
ACT.aSelReq = id => { S.aSelReq = id; render(); };
ACT.aOpenReq = id => { S.aSelReq = id; ACT.go("requests"); };
function adminNotifyFarmer(r, key, p) { if (r.farmerId === "FRM001") { S.notifs.unshift({ id: ++S.nid, type: "ai", key, fid: r.fid, at: S.clock, read: false, p: p || {} }); } }
ACT.aReply = () => { const i = $("#ad-reply"), v = i && i.value.trim(), r = S.requests.find(x => x.id === S.aSelReq); if (!v || !r) return; r.thread.push({ from: "admin", text: v, at: "Today, " + fmtClock(S.clock) }); adminNotifyFarmer(r, "n.reply"); render(); toast("Reply sent to " + r.farmer + ".", "ok"); };
ACT.aFocusReply = () => { const i = $("#ad-reply"); if (i) i.focus(); };
ACT.aAssign = () => assignModal();
ACT.aDoAssign = () => { const r = S.requests.find(x => x.id === S.aSelReq), tech = $("#as-tech").value; if (!r) return; r.status = "assigned"; r.tech = tech; r.thread.push({ from: "admin", text: `Technician has been assigned. ${tech} will contact you shortly.`, at: "Today, " + fmtClock(S.clock) }); adminNotifyFarmer(r, "n.reply"); closeModal(); render(); toast(`${tech} assigned to ${r.id}.`, "ok"); };
ACT.aComplete = () => { const r = S.requests.find(x => x.id === S.aSelReq); if (!r) return; r.status = "done"; r.thread.push({ from: "admin", text: "This request has been marked as completed.", at: "Today, " + fmtClock(S.clock) }); adminNotifyFarmer(r, "n.reply"); render(); toast(r.id + " marked as completed.", "ok"); };

/* ---- boot ---- */
try { const l = localStorage.getItem("agri.lang"); if (l && LANGS.some(x => x.id === l)) LANG = l; } catch (e) { }
render();


</script>
</body>
</html>
